# Runs the test suite and builds the package on every pull request and on pushes to main.
name: "check: ci"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same minor the backend image installs this package with.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

      - name: Import the shipped graphs
        run: |
          python -c "from agents.graphs.react.graph import ReactAgent; from agents.graphs.simple.graph import SimpleChatAgent; assert ReactAgent().prompts['system'].strip(); assert SimpleChatAgent().prompts['system'].strip()"
